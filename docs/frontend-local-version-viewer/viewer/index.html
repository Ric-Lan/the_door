<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Door Local Version Viewer</title>
    <link rel="icon" type="image/svg+xml" href="./assets/the-door-glyph.svg">
    <link rel="stylesheet" href="./styles.css">
    <script src="./lib/cytoscape.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <img id="logo-mark" src="./assets/mark-l1.svg"
               width="42" height="42"
               alt="The Door"
               data-state="l1">
          <div>
            <p class="eyebrow">The Door — Local Version Viewer</p>
            <h1>本地版本 Viewer</h1>
          </div>
        </div>

        <!-- 版本選擇器（多 snapshot 時顯示） -->
        <div id="version-selector-bar" class="version-selector-bar">
          <button class="vsb-pill vsb-pill-a" id="vsb-pill-a" type="button">版本 A</button>
          <button class="vsb-pill vsb-pill-b" id="vsb-pill-b" type="button">版本 B</button>
        </div>

        <nav class="mode-switch" aria-label="viewer mode">
          <button id="btn-diff"     class="mode-button" type="button" data-mode="diff"     title="查看 A 版與 B 版之間的功能差異">差異</button>
          <button id="btn-baseline" class="mode-button" type="button" data-mode="baseline" title="查看 A 版的功能狀態">舊版</button>
          <button id="btn-current"  class="mode-button" type="button" data-mode="current"  title="查看 B 版的功能狀態">新版</button>
        </nav>

        <div class="topbar-actions">
          <button id="btn-back-l1" class="action-button secondary" type="button" hidden>← L1</button>
          <button id="btn-mindmap"  class="action-button"           type="button">心智圖</button>
          <button id="btn-reanalyze" class="action-button"          type="button">重新分析</button>
        </div>

        <div class="status-strip" aria-label="analysis status">
          <span id="count-added"    class="count-badge count-added"    title="B 版相較 A 版新增的功能數量">新增 0</span>
          <span id="count-removed"  class="count-badge count-removed"  title="B 版相較 A 版移除的功能數量">移除 0</span>
          <span id="count-modified" class="count-badge count-modified" title="B 版相較 A 版內容或關聯改變的功能數量">修改 0</span>
          <button id="count-risk" type="button"
                  class="count-badge count-risk count-risk-button"
                  title="點擊只顯示需注意的項目"
                  hidden>注意 0</button>
        </div>
      </header>

      <div id="summary-band" class="summary-band">
        <span id="summary-version-tag" class="summary-version-tag" hidden></span>
        <span id="summary-text">載入中…</span>
      </div>

      <div class="cards-filter-active" id="cards-filter-active" hidden>
        <span class="risk-active-pill">⚠ 僅顯示需注意項目</span>
        <span id="risk-active-counter" class="risk-active-counter"></span>
        <button type="button" id="clear-risk-filter" class="risk-clear-btn">清除全部過濾</button>
      </div>

      <div id="diff-mode-banner" class="diff-mode-banner" hidden>
        <span class="diff-mode-dot"></span>
        <span><strong>DIFF MODE</strong> — 以紅綠標示變動的功能。無變動項以灰色淡化，點選可還原。</span>
      </div>

      <!-- Pipeline progress -->
      <div id="pipeline-progress" class="pipeline-progress" hidden>
        <div class="progress-header">
          <span class="progress-title">正在分析…</span>
          <span id="current-step" class="current-step"></span>
        </div>
        <ul id="steps-list" class="steps-list"></ul>
      </div>

      <div id="breadcrumb"></div>

      <!-- ── Main workspace: cards + detail ── -->
      <main class="workspace">

        <!-- Feature cards (primary content) -->
        <section class="cards-panel" aria-label="feature cards">
          <div class="panel-header">
            <h2 id="list-title">功能總覽</h2>
            <p id="list-source"></p>
          </div>
          <div id="feature-list" class="feature-cards-grid"></div>
        </section>

        <!-- Detail panel -->
        <aside class="detail-panel" aria-label="detail panel">
          <div class="panel-header">
            <h2>詳情</h2>
            <p id="detail-source">尚未選取</p>
          </div>
          <div id="detail-content" class="detail-content empty-state">
            點選左側功能卡片以查看詳情。
          </div>
          <div id="layer-explanation"></div>
        </aside>
      </main>
    </div>

    <!-- ── Graph drawer (slides in from left) ── -->
    <div id="graph-drawer" class="graph-drawer" aria-hidden="true">
      <div class="graph-drawer-header">
        <div class="graph-drawer-title">
          <h2>關聯圖</h2>
          <div id="legend-panel" class="legend-panel-inline"></div>
        </div>
        <div class="graph-drawer-controls">
          <div class="zoom-controls" id="zoom-controls" hidden>
            <button type="button" class="zoom-btn" id="btn-zoom-fit" title="自動適合畫布">⊡</button>
            <button type="button" class="zoom-btn" id="btn-zoom-in"  title="放大">+</button>
            <button type="button" class="zoom-btn" id="btn-zoom-out" title="縮小">−</button>
          </div>
          <button type="button" class="drawer-close-btn" id="btn-drawer-close" title="關閉">✕</button>
        </div>
      </div>
      <div id="graph-container">
        <div id="graph-spinner" class="graph-spinner">
          <span class="spinner-ring"></span>
          <span class="spinner-label">圖形載入中…</span>
        </div>
      </div>
      <div id="mermaid-fallback" style="display:none;"></div>
    </div>

    <!-- Drawer backdrop -->
    <div id="graph-backdrop" class="graph-backdrop" hidden></div>

    <!-- Floating graph toggle button -->
    <button id="btn-graph-toggle" class="graph-toggle-btn" type="button" title="開啟關聯圖">
      <span class="graph-toggle-icon">⊞</span>
      <span class="graph-toggle-label">關聯圖</span>
    </button>

    <!-- Update modal -->
    <div id="update-modal" class="modal-overlay" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">重新分析</h2>
        <p>請輸入舊版與新版的絕對目錄路徑。兩個路徑必須是不同的目錄，且都必須在專案根目錄下。</p>
        <p id="modal-project-hint" class="modal-hint" hidden></p>
        <label for="input-old-path">舊版路徑（old_path）</label>
        <input id="input-old-path" type="text" placeholder="例：C:\Users\...\project\v1" autocomplete="off">
        <label for="input-new-path">新版路徑（new_path）</label>
        <input id="input-new-path" type="text" placeholder="例：C:\Users\...\project\v2" autocomplete="off">
        <label for="input-language">結果語言</label>
        <select id="input-language">
          <option value="zh-Hant" selected>繁體中文 zh-Hant</option>
          <option value="en">English en</option>
        </select>
        <p class="modal-hint">請選擇本次分析結果的呈現語言。這只影響報告與差異推論文字，不影響程式碼解析。</p>
        <div id="modal-error" class="modal-error" hidden></div>
        <div class="modal-actions">
          <button id="btn-modal-cancel" type="button" class="modal-btn modal-btn-cancel">取消</button>
          <button id="btn-modal-submit" type="button" class="modal-btn modal-btn-submit">開始分析</button>
        </div>
      </div>
    </div>

    <script type="module">
      import { init } from "./js/app.js";
      init();
    </script>
  </body>
</html>
