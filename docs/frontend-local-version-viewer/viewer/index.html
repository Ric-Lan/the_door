<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Door Local Version Viewer</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./lib/cytoscape.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-title">
          <p class="eyebrow">The Door — Phase UI-2</p>
          <h1>本地版本 Viewer</h1>
        </div>

        <nav class="mode-switch" aria-label="viewer mode">
          <button id="btn-diff" class="mode-button" type="button" data-mode="diff">差異</button>
          <button id="btn-baseline" class="mode-button" type="button" data-mode="baseline">舊版</button>
          <button id="btn-current" class="mode-button" type="button" data-mode="current">新版</button>
        </nav>

        <div class="topbar-actions">
          <button id="btn-reanalyze" class="action-button" type="button">重新分析</button>
        </div>

        <div class="status-strip" aria-label="analysis status">
          <span id="count-added" class="count-badge count-added" title="新增">+0</span>
          <span id="count-removed" class="count-badge count-removed" title="移除">-0</span>
          <span id="count-modified" class="count-badge count-modified" title="修改">~0</span>
          <span id="count-risk" class="count-badge count-risk" title="風險" hidden>⚠ 0</span>
        </div>
      </header>

      <div id="summary-band" class="summary-band">
        <p id="summary-text">載入中…</p>
      </div>

      <!-- Pipeline progress (shown during update job) -->
      <div id="pipeline-progress" class="pipeline-progress" hidden>
        <div class="progress-header">
          <span class="progress-title">正在分析…</span>
          <span id="current-step" class="current-step"></span>
        </div>
        <ul id="steps-list" class="steps-list"></ul>
      </div>

      <div id="breadcrumb"></div>

      <main class="workspace">
        <aside class="sidebar" aria-label="change list">
          <div class="panel-header">
            <h2 id="list-title">變更清單</h2>
            <p id="list-source">來自 UpdateReport.l1_changes</p>
          </div>
          <div id="diff-sort-toggle"></div>
          <div id="feature-list" class="feature-list"></div>
        </aside>

        <section class="canvas" aria-label="graph canvas">
          <div class="panel-header">
            <h2 id="canvas-title">功能節點</h2>
          </div>
          <div id="graph-container"></div>
          <div id="mermaid-fallback" style="display:none;"></div>
          <div id="graph-nodes" class="graph-nodes"></div>
          <div id="relations-list" class="relations-list" hidden></div>
        </section>

        <aside class="detail-panel" aria-label="detail panel">
          <div class="panel-header">
            <h2>詳情</h2>
            <p id="detail-source">尚未選取</p>
          </div>
          <div id="detail-content" class="detail-content empty-state">
            選取左側項目以查看詳情。
          </div>
          <div id="layer-explanation"></div>
        </aside>
      </main>
    </div>

    <!-- Update modal (shown when user clicks 重新分析) -->
    <div id="update-modal" class="modal-overlay" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">重新分析</h2>
        <p>請輸入舊版與新版的絕對目錄路徑。兩個路徑必須是不同的目錄，且都必須在專案根目錄下。</p>
        <p id="modal-project-hint" class="modal-hint" hidden></p>
        <label for="input-old-path">舊版路徑（old_path）</label>
        <input id="input-old-path" type="text" placeholder="例：C:\Users\...\project\v1" autocomplete="off">
        <label for="input-new-path">新版路徑（new_path）</label>
        <input id="input-new-path" type="text" placeholder="例：C:\Users\...\project\v2" autocomplete="off">
        <div id="modal-error" class="modal-error" hidden></div>
        <div class="modal-actions">
          <button id="btn-modal-cancel" type="button" class="modal-btn modal-btn-cancel">取消</button>
          <button id="btn-modal-submit" type="button" class="modal-btn modal-btn-submit">開始分析</button>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
