<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>心智圖 — The Door</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f0f2f5;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px; height: 44px; flex-shrink: 0;
  background: #263238; color: #fff;
}
#project-name { font-weight: 700; font-size: 14px; margin-right: 4px; }
.tb-divider { color: rgba(255,255,255,0.2); }
.tb-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700;
}
.tb-badge-orange { background: #FF6D00; color: #fff; }
.tb-badge-blue   { background: #E3F2FD; color: #1565C0; border: 1px solid #90CAF9; }
.tb-hint { font-size: 11px; color: rgba(255,255,255,0.45); }
#btn-close {
  margin-left: auto;
  background: rgba(255,255,255,0.12); border: none; color: #fff;
  padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 12px;
}
#btn-close:hover { background: rgba(255,255,255,0.22); }

/* ── Main area ───────────────────────────────────────────── */
#main {
  flex: 1; min-height: 0; position: relative; overflow: hidden;
}

/* ── SVG area ────────────────────────────────────────────── */
#svg-area {
  position: absolute; inset: 0;
  padding: 20px 28px;
  display: flex; align-items: center; justify-content: flex-start;
  overflow: hidden;
}
#loading { padding: 48px; text-align: center; color: #888; font-size: 14px; width: 100%; }
#svg-container { display: flex; align-items: center; height: 100%; }
#svg-container svg { display: block; max-height: 100%; }

/* SVG interaction */
.l1-node { cursor: pointer; }

/* ── Info panel (slide-in overlay) ──────────────────────── */
#info-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: 296px;
  background: #fff;
  border-left: 1px solid #e0e0e0;
  box-shadow: -4px 0 24px rgba(0,0,0,0.10);
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto; padding: 18px 20px; z-index: 20;
}
#info-panel.open { transform: translateX(0); }

#panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
#panel-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #90a4ae; }
#panel-close {
  background: none; border: none; cursor: pointer;
  color: #b0bec5; font-size: 18px; line-height: 1; padding: 0;
}
#panel-close:hover { color: #546e7a; }

#detail-name { font-size: 15px; font-weight: 700; color: #263238; margin-bottom: 3px; line-height: 1.3; }
#detail-id   { font-size: 11px; color: #90a4ae; font-family: monospace; margin-bottom: 16px; word-break: break-all; }

.stat-row { display: flex; gap: 8px; margin-bottom: 16px; }
.stat-box  { flex: 1; background: #f5f7f9; border-radius: 6px; padding: 10px; text-align: center; }
.stat-num  { font-size: 22px; font-weight: 700; color: #263238; }
.stat-lbl  { font-size: 10px; color: #90a4ae; margin-top: 2px; }

.section { margin-bottom: 16px; }
.section h4 {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: #90a4ae; margin-bottom: 8px;
}
.anomaly-item {
  font-size: 12px; color: #bf360c; line-height: 1.45;
  padding: 7px 10px; margin-bottom: 5px;
  background: #fff8f5; border-left: 3px solid #FF6D00; border-radius: 0 4px 4px 0;
}
.diff-chip {
  display: inline-flex; align-items: center;
  font-size: 12px; color: #1565C0;
  padding: 6px 10px; background: #E3F2FD; border-radius: 4px;
}
.module-row {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 0; border-bottom: 1px solid #f0f2f5;
  font-size: 12px; color: #37474f;
}
.module-row:last-child { border-bottom: none; }
.module-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.module-conf {
  margin-left: auto; font-size: 10px; font-weight: 600;
  padding: 1px 5px; border-radius: 3px; flex-shrink: 0;
}
.conf-HIGH   { background: #e8f5e9; color: #2e7d32; }
.conf-MEDIUM { background: #fff8e1; color: #e65100; }
.conf-LOW    { background: #ffebee; color: #c62828; }
.empty-note  { font-size: 12px; color: #b0bec5; font-style: italic; }
</style>
</head>
<body>

<div id="toolbar">
  <span id="project-name">心智圖</span>
  <span class="tb-divider">|</span>
  <span class="tb-badge tb-badge-orange">⚠ N</span><span class="tb-hint">異常</span>
  <span class="tb-divider">|</span>
  <span class="tb-badge tb-badge-blue">Δ 有差異</span><span class="tb-hint">版本差異</span>
  <span class="tb-divider">|</span>
  <span class="tb-hint">點擊節點展開 L2</span>
  <button id="btn-close" onclick="window.close()">關閉視窗</button>
</div>

<div id="main">
  <div id="svg-area">
    <div id="loading">載入中…</div>
    <div id="svg-container" style="display:none"></div>
  </div>

  <div id="info-panel">
    <div id="panel-header">
      <span id="panel-title">功能詳情</span>
      <button id="panel-close" onclick="closePanel()">✕</button>
    </div>
    <div id="detail-name"></div>
    <div id="detail-id"></div>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num" id="stat-modules">—</div><div class="stat-lbl">L2 模組</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-anomalies">—</div><div class="stat-lbl">異常數</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-src">—</div><div class="stat-lbl">Source 節點</div></div>
    </div>
    <div class="section" id="sec-diff"></div>
    <div class="section" id="sec-anom"></div>
    <div class="section" id="sec-modules"></div>
  </div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────
const COL0_X  = 100,  COL1_X = 290,  COL2_X = 500;
const NODE_W0 = 110,  NODE_H0 = 38;
const NODE_W1 = 148,  NODE_H1 = 46;   // taller: 2-line label
const NODE_W2 = 152,  NODE_H2 = 32;   // slightly taller for conf dot
const ROW_H   = 60,   PAD_TOP = 32, PAD_BOT = 32;

const BRANCH_COLORS = [
  "#4285F4","#EA4335","#34A853","#FBBC05",
  "#9C27B0","#FF5722","#00BCD4","#795548",
  "#607D8B","#E91E63","#8BC34A","#FF9800",
];
const DIFF_LABELS = {
  added:              "+ 新增",
  removed:            "- 移除",
  attribute_changed:  "~ 屬性變更",
  dependency_changed: "≠ 依賴變更",
};
const CONF_COLORS = { HIGH: "#43a047", MEDIUM: "#ffa000", LOW: "#e53935" };
const CONF_LABEL  = { HIGH: "HIGH",    MEDIUM: "MED",     LOW:  "LOW"    };

// ── State ────────────────────────────────────────────────────
let data = { project: "", nodes: [], diffNodes: [], diffAvailable: false };
let l2Cache = {};
let expandedSet = new Set();
let hasAnyAnomaly = false;
let selectedId = null;

// ── Boot ─────────────────────────────────────────────────────
async function init() {
  try {
    const raw = sessionStorage.getItem("mindmap-data");
    if (raw) data = JSON.parse(raw);
  } catch (_) {}
  data.nodes         = data.nodes         ?? [];
  data.diffNodes     = data.diffNodes     ?? [];
  data.diffAvailable = data.diffAvailable ?? false;

  const projectName = (data.project || "").split(/[/\\]/).filter(Boolean).pop() || "專案";
  data.projectName = projectName;
  document.getElementById("project-name").textContent = projectName;

  if (!data.nodes.length) {
    document.getElementById("loading").textContent = "無 L1 資料，請先執行分析。";
    return;
  }

  await Promise.allSettled(data.nodes.map(fetchL2));

  hasAnyAnomaly = Object.values(l2Cache)
    .some(v => Array.isArray(v?.anomalies) && v.anomalies.length > 0);

  document.getElementById("loading").style.display = "none";
  document.getElementById("svg-container").style.display = "flex";
  render();
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchL2(node) {
  try {
    const res = await fetch(
      "http://127.0.0.1:8765/api/l2/" + encodeURIComponent(node.id),
      { cache: "no-store" }
    );
    if (res.status === 404) { l2Cache[node.id] = "unanalyzed"; }
    else if (!res.ok)       { l2Cache[node.id] = "error"; }
    else                    { l2Cache[node.id] = await res.json(); }
  } catch (_) { l2Cache[node.id] = "error"; }
}

// ── Layout ────────────────────────────────────────────────────
function computeLayout() {
  let slot = 0;
  const l1Layout = data.nodes.map((node, i) => {
    const color      = BRANCH_COLORS[i % BRANCH_COLORS.length];
    const isExpanded = expandedSet.has(node.id);
    const vm         = l2Cache[node.id];
    const l2nodes    = isExpanded && Array.isArray(vm?.nodes) && vm.nodes.length > 0 ? vm.nodes : null;

    const slots = [];
    if (l2nodes) {
      l2nodes.forEach(l2 => {
        slots.push({ node: l2, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
        slot++;
      });
    } else {
      const phState = isExpanded
        ? (vm === "unanalyzed" ? "unanalyzed" : vm === "error" ? "error" : "empty") : null;
      slots.push({ placeholder: true, phState, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
      slot++;
    }
    const l1y = (slots[0].y + slots[slots.length - 1].y) / 2;
    return { node, color, isExpanded, slots, y: l1y, vm };
  });

  const allL1y  = l1Layout.map(x => x.y);
  const center_y = allL1y.length
    ? (Math.min(...allL1y) + Math.max(...allL1y)) / 2
    : PAD_TOP + ROW_H / 2;

  // Dynamic width: shrink when no L2 visible
  const hasL2 = l1Layout.some(n => n.isExpanded);
  const svgW  = hasL2 ? COL2_X + NODE_W2 / 2 + 28 : COL1_X + NODE_W1 / 2 + 28;

  return { l1Layout, center_y, totalH: slot * ROW_H + PAD_TOP + PAD_BOT, svgW };
}

// ── Render ────────────────────────────────────────────────────
function render() {
  const layout    = computeLayout();
  const area      = document.getElementById("svg-area");
  const container = document.getElementById("svg-container");
  const availH    = area.clientHeight - 40;
  const availW    = area.clientWidth  - 56;
  const scale     = Math.min(1, availH / layout.totalH, availW / layout.svgW);
  const dispW     = Math.round(layout.svgW  * scale);
  const dispH     = Math.round(layout.totalH * scale);

  container.innerHTML = buildSVG(layout, dispW, dispH);
  container.querySelectorAll(".l1-node").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.id;
      if (expandedSet.has(id)) expandedSet.delete(id); else expandedSet.add(id);
      selectedId = id;
      render();
      openPanel(id);
    });
  });
}

// ── Info Panel ────────────────────────────────────────────────
function openPanel(id) {
  const node = data.nodes.find(n => n.id === id);
  if (!node) return;
  const vm        = l2Cache[id];
  const modules   = Array.isArray(vm?.nodes)     ? vm.nodes     : [];
  const anomalies = Array.isArray(vm?.anomalies) ? vm.anomalies : [];
  const diffEntry = data.diffAvailable ? data.diffNodes.find(d => d.id === id) : null;
  const color     = BRANCH_COLORS[data.nodes.indexOf(node) % BRANCH_COLORS.length];
  const totalSrc  = modules.reduce((s, m) => s + (Array.isArray(m.source_nodes) ? m.source_nodes.length : 0), 0);

  document.getElementById("detail-name").textContent = node.label || node.id;
  document.getElementById("detail-id").textContent   = node.id;
  document.getElementById("stat-modules").textContent   =
    vm === "unanalyzed" ? "—" : vm === "error" ? "!" : modules.length;
  document.getElementById("stat-anomalies").textContent = anomalies.length || "0";
  document.getElementById("stat-src").textContent       =
    vm === "unanalyzed" || vm === "error" ? "—" : totalSrc || "0";

  // Diff
  document.getElementById("sec-diff").innerHTML = diffEntry?.change_type
    ? `<h4>Δ 差異資訊</h4><div class="diff-chip">變更類型：${esc(DIFF_LABELS[diffEntry.change_type] ?? diffEntry.change_type)}</div>`
    : "";

  // Anomalies
  document.getElementById("sec-anom").innerHTML = anomalies.length
    ? `<h4>⚠ 異常（${anomalies.length}）</h4>` +
      anomalies.map(a => `<div class="anomaly-item">${esc(a.explanation || a.anomaly_type || "未知異常")}</div>`).join("")
    : "";

  // Modules with confidence
  const secMod = document.getElementById("sec-modules");
  if (vm === "unanalyzed") {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-note">尚未執行 L2 分析</p>`;
  } else if (vm === "error") {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-note" style="color:#e53935">載入失敗</p>`;
  } else if (!modules.length) {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-note">（無模組資料）</p>`;
  } else {
    const confClass = c => c ? `module-conf conf-${c}` : "module-conf";
    secMod.innerHTML = `<h4>L2 模組（${modules.length}）</h4>` +
      modules.map(m => {
        const src = Array.isArray(m.source_nodes) ? m.source_nodes.length : null;
        const srcTxt = src !== null ? `<span style="margin-left:auto;font-size:10px;color:#90a4ae">${src} src</span>` : "";
        const confTxt = m.confidence
          ? `<span class="${confClass(m.confidence)}">${CONF_LABEL[m.confidence] ?? m.confidence}</span>` : "";
        return `<div class="module-row">
          <span class="module-dot" style="background:${color}"></span>
          <span>${esc(m.label || m.id)}</span>
          ${srcTxt}${confTxt}
        </div>`;
      }).join("")
  }

  document.getElementById("info-panel").classList.add("open");
}

function closePanel() {
  selectedId = null;
  document.getElementById("info-panel").classList.remove("open");
}

// ── SVG Builder ───────────────────────────────────────────────
function buildSVG({ l1Layout, center_y, totalH, svgW }, dispW, dispH) {
  const midX01 = (COL0_X + NODE_W0 / 2 + COL1_X - NODE_W1 / 2) / 2;
  const midX12 = (COL1_X + NODE_W1 / 2 + COL2_X - NODE_W2 / 2) / 2;

  let s = `<svg width="${dispW}" height="${dispH}" `
        + `viewBox="0 0 ${svgW} ${totalH}" `
        + `preserveAspectRatio="xMinYMid meet" `
        + `xmlns="http://www.w3.org/2000/svg">`;

  // Center node
  const cx = COL0_X - NODE_W0 / 2, cy = center_y - NODE_H0 / 2;
  s += `<rect x="${cx}" y="${cy}" width="${NODE_W0}" height="${NODE_H0}" rx="8" fill="#263238"/>`;
  s += txt(COL0_X, center_y, "white", 700, 12, trunc(data.projectName || "專案", 9));

  // Center → L1 connectors
  l1Layout.forEach(({ y }) => {
    s += elbow(COL0_X + NODE_W0 / 2, center_y, COL1_X - NODE_W1 / 2, y, midX01);
  });

  // L1 nodes
  l1Layout.forEach(({ node, color, isExpanded, slots, y: l1y, vm }) => {
    // L1 → L2 connectors
    if (isExpanded) {
      slots.forEach(({ y: l2y }) => {
        s += elbow(COL1_X + NODE_W1 / 2, l1y, COL2_X - NODE_W2 / 2, l2y, midX12);
      });
    }

    const nx = COL1_X - NODE_W1 / 2, ny = l1y - NODE_H1 / 2;
    const isSelected = node.id === selectedId;
    const fullLabel  = node.label || node.id;
    const modules    = Array.isArray(vm?.nodes) ? vm.nodes : null;
    const moduleCount = modules ? modules.length : null;

    // Sub-label: module count or status
    let subLabel = null;
    if (vm === "unanalyzed") subLabel = { text: "尚未分析", alpha: 0.5 };
    else if (vm === "error")      subLabel = { text: "載入失敗", alpha: 0.5 };
    else if (moduleCount !== null) subLabel = { text: `${moduleCount} 個模組`, alpha: 0.55 };

    // Node background
    s += `<g class="l1-node" data-id="${esc(node.id)}">`;
    s += `<title>${esc(fullLabel)}</title>`;
    s += `<rect x="${nx}" y="${ny}" width="${NODE_W1}" height="${NODE_H1}" rx="7" `
       + `fill="${color}" fill-opacity="${isExpanded || isSelected ? 1 : 0.85}" `
       + `${isSelected ? `stroke="rgba(255,255,255,0.8)" stroke-width="2"` : ""}/>`;

    // Two-line text
    const hasSubLabel = subLabel !== null;
    const labelY = hasSubLabel ? l1y - 7 : l1y;
    s += txt(nx + 12, labelY, "white", 600, 12, trunc(fullLabel, 10), "start");
    if (hasSubLabel) {
      s += txt(nx + 12, l1y + 8, `rgba(255,255,255,${subLabel.alpha})`, 400, 9, subLabel.text, "start");
    }

    // Expand arrow
    s += txt(nx + NODE_W1 - 12, labelY, "rgba(255,255,255,0.7)", 400, 11, isExpanded ? "▾" : "▸");

    // ── Badges (top-right, above the node) ──
    const anomalyCount = hasAnyAnomaly && Array.isArray(vm?.anomalies) ? vm.anomalies.length : 0;
    let bx = nx + NODE_W1;   // right edge, badges grow leftward

    if (anomalyCount > 0) {
      const bw = 32, bh = 15, cx_ = bx - bw / 2 - 2, by = ny - 1;
      s += `<rect x="${cx_ - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="8" fill="#FF6D00"/>`;
      s += txt(cx_, by, "white", 700, 9, `⚠ ${anomalyCount}`);
      bx -= bw + 4;
    }

    if (data.diffAvailable && data.diffNodes.find(d => d.id === node.id)) {
      const bw = 44, bh = 15, cx_ = bx - bw / 2 - 2, by = ny - 1;
      s += `<rect x="${cx_ - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="3" `
         + `fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>`;
      s += txt(cx_, by, "#1565C0", 700, 9, "Δ 有差異");
    }

    s += `</g>`;

    // ── L2 nodes / placeholders ──
    if (isExpanded) {
      slots.forEach(({ node: l2, placeholder, phState, y: l2y }) => {
        const lx = COL2_X - NODE_W2 / 2, ly = l2y - NODE_H2 / 2;
        if (placeholder) {
          const isErr = phState === "error";
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="${isErr ? "#fff3f3" : "#f5f5f5"}" `
             + `stroke="${isErr ? "#e53935" : "#bdbdbd"}" `
             + `${isErr ? "" : 'stroke-dasharray="4"'}/>`;
          s += txt(COL2_X, l2y, isErr ? "#e53935" : "#9e9e9e", 400, 11,
            isErr ? "載入失敗" : phState === "unanalyzed" ? "尚未分析" : "（無模組）");
        } else {
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="white" stroke="${color}" stroke-width="1.5"/>`;

          // Label (slightly left of center to leave room for indicators)
          const hasConf  = !!l2.confidence;
          const hasSrc   = Array.isArray(l2.source_nodes) && l2.source_nodes.length > 0;
          const rightPad = hasConf ? 36 : hasSrc ? 24 : 10;
          const maxChars = Math.floor((NODE_W2 - 14 - rightPad) / 7);
          s += txt(lx + 10, l2y, color, 500, 11, trunc(l2.label || l2.id, maxChars), "start");

          // Source node count (small grey text)
          if (hasSrc) {
            const srcX = hasConf ? lx + NODE_W2 - 30 : lx + NODE_W2 - 8;
            s += txt(srcX, l2y, "#b0bec5", 400, 9, `${l2.source_nodes.length}`, "end");
          }

          // Confidence dot
          if (hasConf) {
            const confColor = CONF_COLORS[l2.confidence] ?? "#90a4ae";
            const dotX = lx + NODE_W2 - 10;
            s += `<circle cx="${dotX}" cy="${l2y}" r="5" fill="${confColor}"/>`;
          }
        }
      });
    }
  });

  s += `</svg>`;
  return s;
}

// ── Helpers ───────────────────────────────────────────────────
function elbow(x1, y1, x2, y2, mx) {
  const k = `stroke="#cfd8dc" stroke-width="1.2" fill="none"`;
  if (Math.abs(y1 - y2) < 1)
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${k}/>`;
  return `<path d="M${x1},${y1} H${mx} V${y2} H${x2}" ${k}/>`;
}
function txt(x, y, fill, weight, size, content, anchor = "middle") {
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" `
       + `fill="${fill}" font-size="${size}" font-weight="${weight}" `
       + `font-family="-apple-system,BlinkMacSystemFont,sans-serif">${esc(content)}</text>`;
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n) + "…" : s; }
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

window.addEventListener("resize", () => { if (data.nodes.length) render(); });
init();
</script>
</body>
</html>
