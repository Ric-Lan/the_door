<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>心智圖 — The Door</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fafafa; }

#toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: #263238; color: #fff;
}
#project-name { font-weight: 600; font-size: 14px; flex: 1; }
#btn-close {
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
}
#btn-close:hover { background: rgba(255,255,255,0.25); }

#loading { padding: 48px; text-align: center; color: #888; font-size: 14px; }
#svg-container { overflow: auto; padding: 16px; }

.l1-node { cursor: pointer; }
.l1-node:hover rect:first-of-type { filter: brightness(0.88); }
</style>
</head>
<body>
<div id="toolbar">
  <span id="project-name">心智圖</span>
  <button id="btn-close" onclick="window.close()">關閉視窗</button>
</div>
<div id="loading">載入中…</div>
<div id="svg-container" style="display:none"></div>

<script>
// ── Constants ────────────────────────────────────────────────
const COL0_X = 100, COL1_X = 300, COL2_X = 520;
const NODE_W0 = 100, NODE_H0 = 36;
const NODE_W1 = 140, NODE_H1 = 32;
const NODE_W2 = 140, NODE_H2 = 28;
const ROW_H = 52, PAD_TOP = 40, PAD_BOT = 40;
const SVG_W = 700;
const BRANCH_COLORS = [
  "#4285F4","#EA4335","#34A853","#FBBC05",
  "#9C27B0","#FF5722","#00BCD4","#795548",
  "#607D8B","#E91E63","#8BC34A","#FF9800",
];

// ── State ────────────────────────────────────────────────────
let data = { project: "", nodes: [], diffNodes: [], diffAvailable: false };
let l2Cache = {};        // featureId → ViewModel | "unanalyzed" | "error"
let expandedSet = new Set();
let hasAnyAnomaly = false;

// ── Boot ─────────────────────────────────────────────────────
async function init() {
  try {
    const raw = sessionStorage.getItem("mindmap-data");
    if (raw) data = JSON.parse(raw);
  } catch (_) {}
  data.nodes         = data.nodes         ?? [];
  data.diffNodes     = data.diffNodes     ?? [];
  data.diffAvailable = data.diffAvailable ?? false;

  document.getElementById("project-name").textContent = data.project || "心智圖";

  if (!data.nodes.length) {
    document.getElementById("loading").textContent = "無 L1 資料，請先執行分析。";
    return;
  }

  await Promise.allSettled(data.nodes.map(fetchL2));

  hasAnyAnomaly = Object.values(l2Cache)
    .some(v => Array.isArray(v?.anomalies) && v.anomalies.length > 0);

  document.getElementById("loading").style.display = "none";
  document.getElementById("svg-container").style.display = "block";
  render();
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchL2(node) {
  try {
    const res = await fetch(
      "http://127.0.0.1:8765/api/l2/" + encodeURIComponent(node.id),
      { cache: "no-store" }
    );
    if (res.status === 404) {
      l2Cache[node.id] = "unanalyzed";
    } else if (!res.ok) {
      l2Cache[node.id] = "error";
    } else {
      l2Cache[node.id] = await res.json();
    }
  } catch (_) {
    l2Cache[node.id] = "error";
  }
}

// ── Layout ────────────────────────────────────────────────────
function computeLayout() {
  let slot = 0;
  const l1Layout = data.nodes.map((node, i) => {
    const color = BRANCH_COLORS[i % BRANCH_COLORS.length];
    const isExpanded = expandedSet.has(node.id);
    const vm = l2Cache[node.id];
    const l2nodes = isExpanded && Array.isArray(vm?.nodes) && vm.nodes.length > 0
      ? vm.nodes : null;

    const slots = [];
    if (l2nodes) {
      l2nodes.forEach(l2 => {
        slots.push({ node: l2, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
        slot++;
      });
    } else {
      const phState = isExpanded
        ? (vm === "unanalyzed" ? "unanalyzed" : vm === "error" ? "error" : "empty")
        : null;
      slots.push({ placeholder: true, phState, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
      slot++;
    }

    const l1y = (slots[0].y + slots[slots.length - 1].y) / 2;
    return { node, color, isExpanded, slots, y: l1y };
  });

  const allL1y = l1Layout.map(x => x.y);
  const center_y = allL1y.length
    ? (Math.min(...allL1y) + Math.max(...allL1y)) / 2
    : PAD_TOP + ROW_H / 2;

  return { l1Layout, center_y, totalH: slot * ROW_H + PAD_TOP + PAD_BOT };
}

// ── Render ────────────────────────────────────────────────────
function render() {
  document.getElementById("svg-container").innerHTML = buildSVG(computeLayout());
  document.querySelectorAll(".l1-node").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.id;
      if (expandedSet.has(id)) expandedSet.delete(id); else expandedSet.add(id);
      render();
    });
  });
}

// ── SVG Builder ───────────────────────────────────────────────
function buildSVG({ l1Layout, center_y, totalH }) {
  const midX01 = (COL0_X + NODE_W0 / 2 + COL1_X - NODE_W1 / 2) / 2;
  const midX12 = (COL1_X + NODE_W1 / 2 + COL2_X - NODE_W2 / 2) / 2;
  let s = `<svg width="${SVG_W}" height="${totalH}" xmlns="http://www.w3.org/2000/svg">`;

  // Center node
  const cx = COL0_X - NODE_W0 / 2, cy = center_y - NODE_H0 / 2;
  s += `<rect x="${cx}" y="${cy}" width="${NODE_W0}" height="${NODE_H0}" rx="8" fill="#263238"/>`;
  s += txt(COL0_X, center_y, "white", 700, 12, trunc(data.project || "專案", 8));

  // Center → L1 elbow lines
  l1Layout.forEach(({ y }) => {
    s += elbow(COL0_X + NODE_W0 / 2, center_y, COL1_X - NODE_W1 / 2, y, midX01);
  });

  // L1 nodes
  l1Layout.forEach(({ node, color, isExpanded, slots, y: l1y }) => {
    // L1 → L2 elbow lines (expanded only)
    if (isExpanded) {
      slots.forEach(({ y: l2y }) => {
        s += elbow(COL1_X + NODE_W1 / 2, l1y, COL2_X - NODE_W2 / 2, l2y, midX12);
      });
    }

    // L1 node rect + label + expand arrow
    const nx = COL1_X - NODE_W1 / 2, ny = l1y - NODE_H1 / 2;
    const fullLabel = node.label || node.id;
    s += `<g class="l1-node" data-id="${esc(node.id)}">`;
    s += `<title>${esc(fullLabel)}</title>`;
    s += `<rect x="${nx}" y="${ny}" width="${NODE_W1}" height="${NODE_H1}" rx="6" `
       + `fill="${color}" fill-opacity="${isExpanded ? 1 : 0.82}"/>`;
    s += txt(nx + 10, l1y, "white", 600, 12, trunc(fullLabel, 9), "start");
    s += txt(nx + NODE_W1 - 10, l1y, "rgba(255,255,255,0.75)", 400, 10, isExpanded ? "▾" : "▸");

    // Anomaly badge (⚠ N) — shown only if hasAnyAnomaly is true
    const vm = l2Cache[node.id];
    const anomalyCount = hasAnyAnomaly && Array.isArray(vm?.anomalies) ? vm.anomalies.length : 0;
    let rightOffset = nx + NODE_W1 - 8;   // tracks next badge's right edge

    if (anomalyCount > 0) {
      const bw = 28, bh = 14, bx = rightOffset - bw / 2, by = ny - 4;
      s += `<rect x="${bx - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="7" fill="#FF6D00"/>`;
      s += txt(bx, by, "white", 700, 9, `⚠ ${anomalyCount}`);
      rightOffset -= bw + 4;
    }

    // Diff badge (Δ 有差異) — shown only if diffAvailable and this node has a change
    if (data.diffAvailable && data.diffNodes.find(d => d.id === node.id)) {
      const bw = 40, bh = 14, bx = rightOffset - bw / 2 - 4, by = ny - 4;
      s += `<rect x="${bx - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="3" `
         + `fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>`;
      s += txt(bx, by, "#1565C0", 700, 9, "Δ 有差異");
    }

    s += `</g>`;

    // L2 nodes / placeholders (expanded only)
    if (isExpanded) {
      slots.forEach(({ node: l2node, placeholder, phState, y: l2y }) => {
        const lx = COL2_X - NODE_W2 / 2, ly = l2y - NODE_H2 / 2;
        if (placeholder) {
          const isErr = phState === "error";
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="${isErr ? "#fff3f3" : "#f5f5f5"}" `
             + `stroke="${isErr ? "#f44336" : "#bdbdbd"}" `
             + `${isErr ? "" : 'stroke-dasharray="4"'}/>`;
          s += txt(COL2_X, l2y,
            isErr ? "#f44336" : "#9e9e9e", 400, 11,
            isErr ? "載入失敗" : phState === "unanalyzed" ? "尚未分析" : "（無模組）");
        } else {
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="white" stroke="${color}" stroke-width="1.5"/>`;
          s += txt(lx + 10, l2y, color, 500, 11, trunc(l2node.label || l2node.id, 11), "start");
        }
      });
    }
  });

  s += `</svg>`;
  return s;
}

// ── Helpers ───────────────────────────────────────────────────
function elbow(x1, y1, x2, y2, mx) {
  const stroke = `stroke="#cfd8dc" stroke-width="1.2" fill="none"`;
  if (Math.abs(y1 - y2) < 1)
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke}/>`;
  return `<path d="M${x1},${y1} H${mx} V${y2} H${x2}" ${stroke}/>`;
}
function txt(x, y, fill, weight, size, content, anchor = "middle") {
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" `
       + `fill="${fill}" font-size="${size}" font-weight="${weight}" `
       + `font-family="-apple-system,BlinkMacSystemFont,sans-serif">${esc(content)}</text>`;
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n) + "…" : s; }
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

init();
</script>
</body>
</html>
