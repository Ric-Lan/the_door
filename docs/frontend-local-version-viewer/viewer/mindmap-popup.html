<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>心智圖 — The Door</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #fafafa;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: #263238; color: #fff;
  flex-shrink: 0;
}
#project-name { font-weight: 600; font-size: 14px; flex: 1; }
#btn-close {
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
}
#btn-close:hover { background: rgba(255,255,255,0.25); }

/* ── Main layout ─────────────────────────────────────────── */
#layout {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── SVG area ────────────────────────────────────────────── */
#svg-area {
  flex: 0 0 auto;
  overflow: auto;
  border-right: 1px solid #e0e0e0;
}
#loading { padding: 48px 64px; text-align: center; color: #888; font-size: 14px; }

.l1-node { cursor: pointer; }
.l1-node:hover rect { filter: brightness(0.9); }
.l1-node.selected rect:first-of-type { filter: brightness(0.85); }

/* ── Info panel ──────────────────────────────────────────── */
#info-panel {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  background: #fff;
  min-width: 240px;
  max-width: 340px;
}

/* Legend */
#legend h3 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #90a4ae;
  margin-bottom: 14px;
}
.legend-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 12px;
  color: #546e7a;
  line-height: 1.4;
}
.badge-orange {
  display: inline-flex; align-items: center; flex-shrink: 0;
  background: #FF6D00; color: #fff;
  border-radius: 8px; font-size: 10px; font-weight: 700;
  padding: 2px 7px;
}
.badge-blue {
  display: inline-flex; align-items: center; flex-shrink: 0;
  background: #E3F2FD; color: #1565C0;
  border: 1px solid #90CAF9;
  border-radius: 3px; font-size: 10px; font-weight: 700;
  padding: 2px 6px;
}
.badge-arrow {
  display: inline-flex; align-items: center; flex-shrink: 0;
  color: rgba(0,0,0,0.45); font-size: 13px; width: 28px;
  justify-content: center;
}
#legend-hint {
  margin-top: 20px;
  padding: 10px 12px;
  background: #f5f5f5;
  border-radius: 6px;
  font-size: 12px;
  color: #90a4ae;
  line-height: 1.5;
}

/* Detail panel */
#detail { display: none; }
#detail-back {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; color: #607d8b; cursor: pointer;
  margin-bottom: 16px;
  background: none; border: none; padding: 0;
}
#detail-back:hover { color: #263238; }
#detail-name {
  font-size: 16px; font-weight: 700;
  color: #263238; margin-bottom: 4px;
  line-height: 1.3;
}
#detail-id {
  font-size: 11px; color: #90a4ae; margin-bottom: 20px;
  font-family: monospace;
}
.detail-section { margin-bottom: 20px; }
.detail-section h4 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #90a4ae;
  margin-bottom: 8px;
}
.detail-module-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: #37474f;
  padding: 5px 0;
  border-bottom: 1px solid #f5f5f5;
}
.detail-module-item:last-child { border-bottom: none; }
.module-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.anomaly-item {
  font-size: 12px; color: #bf360c;
  padding: 6px 10px;
  background: #fff3e0;
  border-left: 3px solid #FF6D00;
  border-radius: 0 4px 4px 0;
  margin-bottom: 6px;
  line-height: 1.4;
}
.diff-info {
  font-size: 12px; color: #1565C0;
  padding: 8px 10px;
  background: #E3F2FD;
  border-radius: 4px;
}
.empty-state-text {
  font-size: 12px; color: #b0bec5; font-style: italic;
}
.stat-row {
  display: flex; gap: 16px; margin-bottom: 16px;
}
.stat-box {
  flex: 1;
  background: #f5f5f5;
  border-radius: 6px;
  padding: 10px 12px;
  text-align: center;
}
.stat-box .num { font-size: 20px; font-weight: 700; color: #263238; }
.stat-box .label { font-size: 10px; color: #90a4ae; margin-top: 2px; }
</style>
</head>
<body>
<div id="toolbar">
  <span id="project-name">心智圖</span>
  <button id="btn-close" onclick="window.close()">關閉視窗</button>
</div>

<div id="layout">
  <div id="svg-area">
    <div id="loading">載入中…</div>
    <div id="svg-container" style="display:none"></div>
  </div>

  <aside id="info-panel">
    <!-- Legend (default state) -->
    <div id="legend">
      <h3>圖例</h3>
      <div class="legend-item">
        <span class="badge-orange">⚠ N</span>
        <span>掃描發現 N 個程式碼異常，點擊節點查看詳情</span>
      </div>
      <div class="legend-item">
        <span class="badge-blue">Δ 有差異</span>
        <span>與基準版本相比，此功能有結構或屬性變更</span>
      </div>
      <div class="legend-item">
        <span class="badge-arrow">▸▾</span>
        <span>點擊 L1 節點可展開或收合其 L2 模組清單</span>
      </div>
      <p id="legend-hint">點擊左方任一 L1 功能節點，即可在此查看詳細資訊。</p>
    </div>

    <!-- Detail (selected state) -->
    <div id="detail">
      <button id="detail-back" onclick="clearSelection()">← 返回圖例</button>
      <div id="detail-name"></div>
      <div id="detail-id"></div>
      <div class="stat-row">
        <div class="stat-box">
          <div class="num" id="stat-modules">—</div>
          <div class="label">L2 模組</div>
        </div>
        <div class="stat-box">
          <div class="num" id="stat-anomalies">—</div>
          <div class="label">異常數</div>
        </div>
      </div>
      <div class="detail-section" id="section-diff"></div>
      <div class="detail-section" id="section-anomalies"></div>
      <div class="detail-section" id="section-modules"></div>
    </div>
  </aside>
</div>

<script>
// ── Constants ────────────────────────────────────────────────
const COL0_X = 100, COL1_X = 300, COL2_X = 520;
const NODE_W0 = 120, NODE_H0 = 36;
const NODE_W1 = 140, NODE_H1 = 32;
const NODE_W2 = 140, NODE_H2 = 28;
const ROW_H = 52, PAD_TOP = 40, PAD_BOT = 40;
const SVG_W = 720;
const BRANCH_COLORS = [
  "#4285F4","#EA4335","#34A853","#FBBC05",
  "#9C27B0","#FF5722","#00BCD4","#795548",
  "#607D8B","#E91E63","#8BC34A","#FF9800",
];
const DIFF_LABELS = {
  added:              "+ 新增",
  removed:            "- 移除",
  attribute_changed:  "~ 屬性變更",
  dependency_changed: "≠ 依賴變更",
};

// ── State ────────────────────────────────────────────────────
let data = { project: "", nodes: [], diffNodes: [], diffAvailable: false };
let l2Cache = {};
let expandedSet = new Set();
let hasAnyAnomaly = false;
let selectedId = null;

// ── Boot ─────────────────────────────────────────────────────
async function init() {
  try {
    const raw = sessionStorage.getItem("mindmap-data");
    if (raw) data = JSON.parse(raw);
  } catch (_) {}
  data.nodes         = data.nodes         ?? [];
  data.diffNodes     = data.diffNodes     ?? [];
  data.diffAvailable = data.diffAvailable ?? false;

  // Extract basename from path (e.g. "C:\Users\foo\my-project" → "my-project")
  const projectName = (data.project || "").split(/[/\\]/).filter(Boolean).pop() || "專案";
  data.projectName = projectName;
  document.getElementById("project-name").textContent = projectName;

  if (!data.nodes.length) {
    document.getElementById("loading").textContent = "無 L1 資料，請先執行分析。";
    return;
  }

  await Promise.allSettled(data.nodes.map(fetchL2));

  hasAnyAnomaly = Object.values(l2Cache)
    .some(v => Array.isArray(v?.anomalies) && v.anomalies.length > 0);

  document.getElementById("loading").style.display = "none";
  document.getElementById("svg-container").style.display = "block";
  render();
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchL2(node) {
  try {
    const res = await fetch(
      "http://127.0.0.1:8765/api/l2/" + encodeURIComponent(node.id),
      { cache: "no-store" }
    );
    if (res.status === 404) {
      l2Cache[node.id] = "unanalyzed";
    } else if (!res.ok) {
      l2Cache[node.id] = "error";
    } else {
      l2Cache[node.id] = await res.json();
    }
  } catch (_) {
    l2Cache[node.id] = "error";
  }
}

// ── Layout ────────────────────────────────────────────────────
function computeLayout() {
  let slot = 0;
  const l1Layout = data.nodes.map((node, i) => {
    const color = BRANCH_COLORS[i % BRANCH_COLORS.length];
    const isExpanded = expandedSet.has(node.id);
    const vm = l2Cache[node.id];
    const l2nodes = isExpanded && Array.isArray(vm?.nodes) && vm.nodes.length > 0
      ? vm.nodes : null;

    const slots = [];
    if (l2nodes) {
      l2nodes.forEach(l2 => {
        slots.push({ node: l2, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
        slot++;
      });
    } else {
      const phState = isExpanded
        ? (vm === "unanalyzed" ? "unanalyzed" : vm === "error" ? "error" : "empty")
        : null;
      slots.push({ placeholder: true, phState, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
      slot++;
    }

    const l1y = (slots[0].y + slots[slots.length - 1].y) / 2;
    return { node, color, isExpanded, slots, y: l1y };
  });

  const allL1y = l1Layout.map(x => x.y);
  const center_y = allL1y.length
    ? (Math.min(...allL1y) + Math.max(...allL1y)) / 2
    : PAD_TOP + ROW_H / 2;

  return { l1Layout, center_y, totalH: slot * ROW_H + PAD_TOP + PAD_BOT };
}

// ── Render ────────────────────────────────────────────────────
function render() {
  document.getElementById("svg-container").innerHTML = buildSVG(computeLayout());
  document.querySelectorAll(".l1-node").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.id;
      if (expandedSet.has(id)) expandedSet.delete(id); else expandedSet.add(id);
      selectedId = id;
      render();
      updateInfoPanel(id);
    });
  });
  // Restore selected highlight
  if (selectedId) {
    const el = document.querySelector(`.l1-node[data-id="${CSS.escape(selectedId)}"]`);
    if (el) el.classList.add("selected");
  }
}

// ── Info Panel ────────────────────────────────────────────────
function clearSelection() {
  selectedId = null;
  document.querySelectorAll(".l1-node.selected").forEach(el => el.classList.remove("selected"));
  document.getElementById("legend").style.display = "block";
  document.getElementById("detail").style.display = "none";
}

function updateInfoPanel(id) {
  const node = data.nodes.find(n => n.id === id);
  if (!node) return;

  document.getElementById("legend").style.display = "none";
  document.getElementById("detail").style.display = "block";

  const vm = l2Cache[id];
  const modules = Array.isArray(vm?.nodes) ? vm.nodes : [];
  const anomalies = Array.isArray(vm?.anomalies) ? vm.anomalies : [];
  const diffEntry = data.diffAvailable ? data.diffNodes.find(d => d.id === id) : null;
  const color = BRANCH_COLORS[data.nodes.indexOf(node) % BRANCH_COLORS.length];

  document.getElementById("detail-name").textContent = node.label || node.id;
  document.getElementById("detail-id").textContent = node.id;
  document.getElementById("stat-modules").textContent =
    vm === "unanalyzed" ? "—" : vm === "error" ? "!" : modules.length;
  document.getElementById("stat-anomalies").textContent = anomalies.length || "0";

  // Diff section
  const secDiff = document.getElementById("section-diff");
  if (diffEntry?.change_type) {
    secDiff.innerHTML = `<h4>Δ 差異資訊</h4>
      <div class="diff-info">變更類型：${esc(DIFF_LABELS[diffEntry.change_type] ?? diffEntry.change_type)}</div>`;
  } else {
    secDiff.innerHTML = "";
  }

  // Anomaly section
  const secAnom = document.getElementById("section-anomalies");
  if (anomalies.length) {
    secAnom.innerHTML = `<h4>⚠ 異常（${anomalies.length}）</h4>` +
      anomalies.map(a =>
        `<div class="anomaly-item">${esc(a.explanation || a.anomaly_type || "未知異常")}</div>`
      ).join("");
  } else {
    secAnom.innerHTML = "";
  }

  // Module section
  const secMod = document.getElementById("section-modules");
  if (vm === "unanalyzed") {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-state-text">尚未執行 L2 分析</p>`;
  } else if (vm === "error") {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-state-text" style="color:#f44336">載入失敗</p>`;
  } else if (!modules.length) {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-state-text">（無模組資料）</p>`;
  } else {
    secMod.innerHTML = `<h4>L2 模組（${modules.length}）</h4>` +
      modules.map(m => `<div class="detail-module-item">
        <span class="module-dot" style="background:${color}"></span>
        ${esc(m.label || m.id)}
      </div>`).join("");
  }
}

// ── SVG Builder ───────────────────────────────────────────────
function buildSVG({ l1Layout, center_y, totalH }) {
  const midX01 = (COL0_X + NODE_W0 / 2 + COL1_X - NODE_W1 / 2) / 2;
  const midX12 = (COL1_X + NODE_W1 / 2 + COL2_X - NODE_W2 / 2) / 2;
  let s = `<svg width="${SVG_W}" height="${totalH}" xmlns="http://www.w3.org/2000/svg">`;

  // Center node
  const cx = COL0_X - NODE_W0 / 2, cy = center_y - NODE_H0 / 2;
  s += `<rect x="${cx}" y="${cy}" width="${NODE_W0}" height="${NODE_H0}" rx="8" fill="#263238"/>`;
  s += txt(COL0_X, center_y, "white", 700, 12, trunc(data.projectName || "專案", 9));

  // Center → L1 elbow lines
  l1Layout.forEach(({ y }) => {
    s += elbow(COL0_X + NODE_W0 / 2, center_y, COL1_X - NODE_W1 / 2, y, midX01);
  });

  // L1 nodes
  l1Layout.forEach(({ node, color, isExpanded, slots, y: l1y }) => {
    if (isExpanded) {
      slots.forEach(({ y: l2y }) => {
        s += elbow(COL1_X + NODE_W1 / 2, l1y, COL2_X - NODE_W2 / 2, l2y, midX12);
      });
    }

    const nx = COL1_X - NODE_W1 / 2, ny = l1y - NODE_H1 / 2;
    const fullLabel = node.label || node.id;
    const isSelected = node.id === selectedId;
    s += `<g class="l1-node${isSelected ? " selected" : ""}" data-id="${esc(node.id)}">`;
    s += `<title>${esc(fullLabel)}</title>`;
    s += `<rect x="${nx}" y="${ny}" width="${NODE_W1}" height="${NODE_H1}" rx="6" `
       + `fill="${color}" fill-opacity="${isExpanded || isSelected ? 1 : 0.82}"/>`;
    s += txt(nx + 10, l1y, "white", 600, 12, trunc(fullLabel, 9), "start");
    s += txt(nx + NODE_W1 - 10, l1y, "rgba(255,255,255,0.75)", 400, 10, isExpanded ? "▾" : "▸");

    // Anomaly badge
    const vm = l2Cache[node.id];
    const anomalyCount = hasAnyAnomaly && Array.isArray(vm?.anomalies) ? vm.anomalies.length : 0;
    let rightOffset = nx + NODE_W1 - 8;

    if (anomalyCount > 0) {
      const bw = 28, bh = 14, bx = rightOffset - bw / 2, by = ny - 4;
      s += `<rect x="${bx - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="7" fill="#FF6D00"/>`;
      s += txt(bx, by, "white", 700, 9, `⚠ ${anomalyCount}`);
      rightOffset -= bw + 4;
    }

    // Diff badge
    if (data.diffAvailable && data.diffNodes.find(d => d.id === node.id)) {
      const bw = 40, bh = 14, bx = rightOffset - bw / 2 - 4, by = ny - 4;
      s += `<rect x="${bx - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="3" `
         + `fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>`;
      s += txt(bx, by, "#1565C0", 700, 9, "Δ 有差異");
    }

    s += `</g>`;

    // L2 nodes / placeholders
    if (isExpanded) {
      slots.forEach(({ node: l2node, placeholder, phState, y: l2y }) => {
        const lx = COL2_X - NODE_W2 / 2, ly = l2y - NODE_H2 / 2;
        if (placeholder) {
          const isErr = phState === "error";
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="${isErr ? "#fff3f3" : "#f5f5f5"}" `
             + `stroke="${isErr ? "#f44336" : "#bdbdbd"}" `
             + `${isErr ? "" : 'stroke-dasharray="4"'}/>`;
          s += txt(COL2_X, l2y,
            isErr ? "#f44336" : "#9e9e9e", 400, 11,
            isErr ? "載入失敗" : phState === "unanalyzed" ? "尚未分析" : "（無模組）");
        } else {
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="white" stroke="${color}" stroke-width="1.5"/>`;
          s += txt(lx + 10, l2y, color, 500, 11, trunc(l2node.label || l2node.id, 11), "start");
        }
      });
    }
  });

  s += `</svg>`;
  return s;
}

// ── Helpers ───────────────────────────────────────────────────
function elbow(x1, y1, x2, y2, mx) {
  const stroke = `stroke="#cfd8dc" stroke-width="1.2" fill="none"`;
  if (Math.abs(y1 - y2) < 1)
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke}/>`;
  return `<path d="M${x1},${y1} H${mx} V${y2} H${x2}" ${stroke}/>`;
}
function txt(x, y, fill, weight, size, content, anchor = "middle") {
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" `
       + `fill="${fill}" font-size="${size}" font-weight="${weight}" `
       + `font-family="-apple-system,BlinkMacSystemFont,sans-serif">${esc(content)}</text>`;
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n) + "…" : s; }
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

init();
</script>
</body>
</html>
