<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>心智圖 — The Door</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7f9;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; height: 44px; flex-shrink: 0;
  background: #263238; color: #fff;
}
#project-name { font-weight: 600; font-size: 14px; flex: 1; }
#toolbar-legend {
  display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgba(255,255,255,0.6);
}
.tl-badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 7px; border-radius: 8px; font-size: 10px; font-weight: 700;
}
.tl-badge-orange { background: #FF6D00; color: #fff; }
.tl-badge-blue   { background: #E3F2FD; color: #1565C0; border: 1px solid #90CAF9; }
.tl-sep { color: rgba(255,255,255,0.25); }
#btn-close {
  background: rgba(255,255,255,0.15); border: none; color: #fff;
  padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; flex-shrink: 0;
}
#btn-close:hover { background: rgba(255,255,255,0.25); }

/* ── Main area ───────────────────────────────────────────── */
#main {
  flex: 1;
  min-height: 0;
  position: relative;   /* anchor for absolute children */
  overflow: hidden;
}

/* ── SVG area ────────────────────────────────────────────── */
#svg-area {
  position: absolute;
  inset: 0;
  padding: 16px 24px;
  overflow: hidden;     /* SVG auto-fits; no scroll needed */
  display: flex;
  align-items: center;
}
#loading { padding: 48px; text-align: center; color: #888; font-size: 14px; width: 100%; }
#svg-container { flex: 1; height: 100%; overflow: hidden; }
#svg-container svg { display: block; max-height: 100%; }

/* SVG interaction */
.l1-node { cursor: pointer; }
.l1-node:hover rect:first-of-type { filter: brightness(0.88); }

/* ── Legend card (floating, bottom-left) ─────────────────── */
#legend-card {
  position: absolute;
  bottom: 16px; left: 16px;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 10px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  font-size: 11px; color: #546e7a;
  line-height: 1.6;
  pointer-events: none;
  z-index: 5;
}
#legend-card .lc-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; color: #90a4ae; margin-bottom: 6px;
}
#legend-card .lc-row { display: flex; align-items: center; gap: 7px; }
.lc-badge-o {
  display: inline-flex; padding: 1px 5px; border-radius: 6px;
  background: #FF6D00; color: #fff; font-size: 9px; font-weight: 700; flex-shrink: 0;
}
.lc-badge-b {
  display: inline-flex; padding: 1px 5px; border-radius: 3px;
  background: #E3F2FD; color: #1565C0; border: 1px solid #90CAF9;
  font-size: 9px; font-weight: 700; flex-shrink: 0;
}

/* ── Info panel (slide-in overlay from right) ────────────── */
#info-panel {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 300px;
  background: #fff;
  border-left: 1px solid #e0e0e0;
  box-shadow: -4px 0 20px rgba(0,0,0,0.10);
  transform: translateX(100%);
  transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
  padding: 20px;
  z-index: 20;
}
#info-panel.open { transform: translateX(0); }

#detail-close {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
#detail-close-label {
  font-size: 11px; color: #90a4ae;
  text-transform: uppercase; letter-spacing: 0.05em;
}
#detail-close-btn {
  background: none; border: none; cursor: pointer;
  color: #b0bec5; font-size: 18px; line-height: 1;
  padding: 0 2px;
}
#detail-close-btn:hover { color: #546e7a; }

#detail-name {
  font-size: 15px; font-weight: 700; color: #263238;
  margin-bottom: 3px; line-height: 1.3;
}
#detail-id {
  font-size: 11px; color: #90a4ae; font-family: monospace;
  margin-bottom: 16px; word-break: break-all;
}
.stat-row { display: flex; gap: 10px; margin-bottom: 18px; }
.stat-box {
  flex: 1; background: #f5f5f5; border-radius: 6px;
  padding: 10px; text-align: center;
}
.stat-num { font-size: 22px; font-weight: 700; color: #263238; }
.stat-lbl { font-size: 10px; color: #90a4ae; margin-top: 2px; }

.detail-section { margin-bottom: 18px; }
.detail-section h4 {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: #90a4ae; margin-bottom: 8px;
}
.anomaly-item {
  font-size: 12px; color: #bf360c; line-height: 1.4;
  padding: 7px 10px; margin-bottom: 6px;
  background: #fff8f5; border-left: 3px solid #FF6D00;
  border-radius: 0 4px 4px 0;
}
.diff-info {
  font-size: 12px; color: #1565C0;
  padding: 8px 10px; background: #E3F2FD; border-radius: 4px;
}
.module-row {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 0; border-bottom: 1px solid #f5f5f5;
  font-size: 12px; color: #37474f;
}
.module-row:last-child { border-bottom: none; }
.module-dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.empty-note { font-size: 12px; color: #b0bec5; font-style: italic; }
</style>
</head>
<body>

<div id="toolbar">
  <span id="project-name">心智圖</span>
  <div id="toolbar-legend">
    <span class="tl-badge tl-badge-orange">⚠ N</span><span>異常</span>
    <span class="tl-sep">|</span>
    <span class="tl-badge tl-badge-blue">Δ 有差異</span><span>版本差異</span>
    <span class="tl-sep">|</span>
    <span>點擊節點展開 L2</span>
  </div>
  <button id="btn-close" onclick="window.close()">關閉視窗</button>
</div>

<div id="main">
  <div id="svg-area">
    <div id="loading">載入中…</div>
    <div id="svg-container" style="display:none"></div>
  </div>

  <!-- Floating legend card -->
  <div id="legend-card" style="display:none">
    <div class="lc-title">圖例</div>
    <div class="lc-row"><span class="lc-badge-o">⚠ N</span> 程式碼異常數量</div>
    <div class="lc-row" style="margin-top:4px"><span class="lc-badge-b">Δ 有差異</span> 與基準版本有差異</div>
  </div>

  <!-- Slide-in info panel -->
  <div id="info-panel">
    <div id="detail-close">
      <span id="detail-close-label">功能詳情</span>
      <button id="detail-close-btn" onclick="closePanel()" title="關閉">✕</button>
    </div>
    <div id="detail-name"></div>
    <div id="detail-id"></div>
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num" id="stat-modules">—</div><div class="stat-lbl">L2 模組</div></div>
      <div class="stat-box"><div class="stat-num" id="stat-anomalies">—</div><div class="stat-lbl">異常數</div></div>
    </div>
    <div class="detail-section" id="section-diff"></div>
    <div class="detail-section" id="section-anomalies"></div>
    <div class="detail-section" id="section-modules"></div>
  </div>
</div>

<script>
// ── Constants ────────────────────────────────────────────────
const COL0_X = 110, COL1_X = 310, COL2_X = 530;
const NODE_W0 = 120, NODE_H0 = 38;
const NODE_W1 = 148, NODE_H1 = 34;
const NODE_W2 = 148, NODE_H2 = 28;
const ROW_H = 52, PAD_TOP = 32, PAD_BOT = 32;
const SVG_W = 740;
const BRANCH_COLORS = [
  "#4285F4","#EA4335","#34A853","#FBBC05",
  "#9C27B0","#FF5722","#00BCD4","#795548",
  "#607D8B","#E91E63","#8BC34A","#FF9800",
];
const DIFF_LABELS = {
  added:              "+ 新增",
  removed:            "- 移除",
  attribute_changed:  "~ 屬性變更",
  dependency_changed: "≠ 依賴變更",
};

// ── State ────────────────────────────────────────────────────
let data = { project: "", nodes: [], diffNodes: [], diffAvailable: false };
let l2Cache = {};
let expandedSet = new Set();
let hasAnyAnomaly = false;
let selectedId = null;

// ── Boot ─────────────────────────────────────────────────────
async function init() {
  try {
    const raw = sessionStorage.getItem("mindmap-data");
    if (raw) data = JSON.parse(raw);
  } catch (_) {}
  data.nodes         = data.nodes         ?? [];
  data.diffNodes     = data.diffNodes     ?? [];
  data.diffAvailable = data.diffAvailable ?? false;

  // Extract basename from full path
  const projectName = (data.project || "").split(/[/\\]/).filter(Boolean).pop() || "專案";
  data.projectName = projectName;
  document.getElementById("project-name").textContent = projectName;

  if (!data.nodes.length) {
    document.getElementById("loading").textContent = "無 L1 資料，請先執行分析。";
    return;
  }

  await Promise.allSettled(data.nodes.map(fetchL2));

  hasAnyAnomaly = Object.values(l2Cache)
    .some(v => Array.isArray(v?.anomalies) && v.anomalies.length > 0);

  document.getElementById("loading").style.display = "none";
  document.getElementById("svg-container").style.display = "block";
  document.getElementById("legend-card").style.display = "block";
  render();
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchL2(node) {
  try {
    const res = await fetch(
      "http://127.0.0.1:8765/api/l2/" + encodeURIComponent(node.id),
      { cache: "no-store" }
    );
    if (res.status === 404) { l2Cache[node.id] = "unanalyzed"; }
    else if (!res.ok)       { l2Cache[node.id] = "error"; }
    else                    { l2Cache[node.id] = await res.json(); }
  } catch (_) { l2Cache[node.id] = "error"; }
}

// ── Layout ────────────────────────────────────────────────────
function computeLayout() {
  let slot = 0;
  const l1Layout = data.nodes.map((node, i) => {
    const color = BRANCH_COLORS[i % BRANCH_COLORS.length];
    const isExpanded = expandedSet.has(node.id);
    const vm = l2Cache[node.id];
    const l2nodes = isExpanded && Array.isArray(vm?.nodes) && vm.nodes.length > 0 ? vm.nodes : null;

    const slots = [];
    if (l2nodes) {
      l2nodes.forEach(l2 => {
        slots.push({ node: l2, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
        slot++;
      });
    } else {
      const phState = isExpanded
        ? (vm === "unanalyzed" ? "unanalyzed" : vm === "error" ? "error" : "empty")
        : null;
      slots.push({ placeholder: true, phState, y: PAD_TOP + slot * ROW_H + ROW_H / 2 });
      slot++;
    }

    const l1y = (slots[0].y + slots[slots.length - 1].y) / 2;
    return { node, color, isExpanded, slots, y: l1y };
  });

  const allL1y = l1Layout.map(x => x.y);
  const center_y = allL1y.length
    ? (Math.min(...allL1y) + Math.max(...allL1y)) / 2
    : PAD_TOP + ROW_H / 2;

  return { l1Layout, center_y, totalH: slot * ROW_H + PAD_TOP + PAD_BOT };
}

// ── Render ────────────────────────────────────────────────────
function render() {
  const layout = computeLayout();

  // Compute available height and scale SVG to fit
  const container = document.getElementById("svg-container");
  const area = document.getElementById("svg-area");
  const availH = area.clientHeight - 32;
  const availW = area.clientWidth - 48;

  const scaleH = availH / layout.totalH;
  const scaleW = availW / SVG_W;
  const scale  = Math.min(1, scaleH, scaleW);   // never scale up, only down
  const dispW  = Math.round(SVG_W  * scale);
  const dispH  = Math.round(layout.totalH * scale);

  container.innerHTML = buildSVG(layout, dispW, dispH);
  container.querySelectorAll(".l1-node").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.id;
      if (expandedSet.has(id)) expandedSet.delete(id); else expandedSet.add(id);
      selectedId = id;
      render();
      openPanel(id);
    });
  });
}

// ── Info Panel ────────────────────────────────────────────────
function openPanel(id) {
  const node = data.nodes.find(n => n.id === id);
  if (!node) return;

  const vm = l2Cache[id];
  const modules   = Array.isArray(vm?.nodes) ? vm.nodes : [];
  const anomalies = Array.isArray(vm?.anomalies) ? vm.anomalies : [];
  const diffEntry = data.diffAvailable ? data.diffNodes.find(d => d.id === id) : null;
  const color     = BRANCH_COLORS[data.nodes.indexOf(node) % BRANCH_COLORS.length];

  document.getElementById("detail-name").textContent = node.label || node.id;
  document.getElementById("detail-id").textContent   = node.id;
  document.getElementById("stat-modules").textContent =
    vm === "unanalyzed" ? "—" : vm === "error" ? "!" : modules.length;
  document.getElementById("stat-anomalies").textContent = anomalies.length || "0";

  // Diff
  const secDiff = document.getElementById("section-diff");
  secDiff.innerHTML = diffEntry?.change_type
    ? `<h4>Δ 差異資訊</h4><div class="diff-info">變更類型：${esc(DIFF_LABELS[diffEntry.change_type] ?? diffEntry.change_type)}</div>`
    : "";

  // Anomalies
  const secAnom = document.getElementById("section-anomalies");
  secAnom.innerHTML = anomalies.length
    ? `<h4>⚠ 異常（${anomalies.length}）</h4>` +
      anomalies.map(a => `<div class="anomaly-item">${esc(a.explanation || a.anomaly_type || "未知異常")}</div>`).join("")
    : "";

  // Modules
  const secMod = document.getElementById("section-modules");
  if (vm === "unanalyzed") {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-note">尚未執行 L2 分析</p>`;
  } else if (vm === "error") {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-note" style="color:#f44336">載入失敗</p>`;
  } else if (!modules.length) {
    secMod.innerHTML = `<h4>L2 模組</h4><p class="empty-note">（無模組資料）</p>`;
  } else {
    secMod.innerHTML = `<h4>L2 模組（${modules.length}）</h4>` +
      modules.map(m => `<div class="module-row">
        <span class="module-dot" style="background:${color}"></span>
        ${esc(m.label || m.id)}
      </div>`).join("");
  }

  document.getElementById("info-panel").classList.add("open");
}

function closePanel() {
  selectedId = null;
  document.getElementById("info-panel").classList.remove("open");
}

// ── SVG Builder ───────────────────────────────────────────────
function buildSVG({ l1Layout, center_y, totalH }, dispW, dispH) {
  const midX01 = (COL0_X + NODE_W0 / 2 + COL1_X - NODE_W1 / 2) / 2;
  const midX12 = (COL1_X + NODE_W1 / 2 + COL2_X - NODE_W2 / 2) / 2;

  let s = `<svg width="${dispW}" height="${dispH}" `
        + `viewBox="0 0 ${SVG_W} ${totalH}" `
        + `preserveAspectRatio="xMinYMid meet" `
        + `xmlns="http://www.w3.org/2000/svg">`;

  // Center node
  const cx = COL0_X - NODE_W0 / 2, cy = center_y - NODE_H0 / 2;
  s += `<rect x="${cx}" y="${cy}" width="${NODE_W0}" height="${NODE_H0}" rx="8" fill="#263238"/>`;
  s += txt(COL0_X, center_y, "white", 700, 13, trunc(data.projectName || "專案", 9));

  // Center → L1 lines
  l1Layout.forEach(({ y }) => {
    s += elbow(COL0_X + NODE_W0 / 2, center_y, COL1_X - NODE_W1 / 2, y, midX01);
  });

  // L1 nodes
  l1Layout.forEach(({ node, color, isExpanded, slots, y: l1y }) => {
    if (isExpanded) {
      slots.forEach(({ y: l2y }) => {
        s += elbow(COL1_X + NODE_W1 / 2, l1y, COL2_X - NODE_W2 / 2, l2y, midX12);
      });
    }

    const nx = COL1_X - NODE_W1 / 2, ny = l1y - NODE_H1 / 2;
    const isSelected = node.id === selectedId;
    const fullLabel  = node.label || node.id;

    s += `<g class="l1-node" data-id="${esc(node.id)}">`;
    s += `<title>${esc(fullLabel)}</title>`;
    s += `<rect x="${nx}" y="${ny}" width="${NODE_W1}" height="${NODE_H1}" rx="6" `
       + `fill="${color}" fill-opacity="${isExpanded || isSelected ? 1 : 0.82}" `
       + `${isSelected ? `stroke="white" stroke-width="2"` : ""}/>`;
    s += txt(nx + 10, l1y, "white", 600, 12, trunc(fullLabel, 9), "start");
    s += txt(nx + NODE_W1 - 10, l1y, "rgba(255,255,255,0.75)", 400, 10, isExpanded ? "▾" : "▸");

    // Anomaly badge
    const vm = l2Cache[node.id];
    const anomalyCount = hasAnyAnomaly && Array.isArray(vm?.anomalies) ? vm.anomalies.length : 0;
    let rightOffset = nx + NODE_W1 - 6;

    if (anomalyCount > 0) {
      const bw = 30, bh = 15, bx = rightOffset - bw / 2, by = ny - 5;
      s += `<rect x="${bx - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="8" fill="#FF6D00"/>`;
      s += txt(bx, by, "white", 700, 9, `⚠ ${anomalyCount}`);
      rightOffset -= bw + 4;
    }

    // Diff badge
    if (data.diffAvailable && data.diffNodes.find(d => d.id === node.id)) {
      const bw = 42, bh = 15, bx = rightOffset - bw / 2 - 2, by = ny - 5;
      s += `<rect x="${bx - bw/2}" y="${by - bh/2}" width="${bw}" height="${bh}" rx="3" `
         + `fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>`;
      s += txt(bx, by, "#1565C0", 700, 9, "Δ 有差異");
    }

    s += `</g>`;

    if (isExpanded) {
      slots.forEach(({ node: l2node, placeholder, phState, y: l2y }) => {
        const lx = COL2_X - NODE_W2 / 2, ly = l2y - NODE_H2 / 2;
        if (placeholder) {
          const isErr = phState === "error";
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="${isErr ? "#fff3f3" : "#f5f5f5"}" `
             + `stroke="${isErr ? "#f44336" : "#bdbdbd"}" `
             + `${isErr ? "" : 'stroke-dasharray="4"'}/>`;
          s += txt(COL2_X, l2y, isErr ? "#f44336" : "#9e9e9e", 400, 11,
            isErr ? "載入失敗" : phState === "unanalyzed" ? "尚未分析" : "（無模組）");
        } else {
          s += `<rect x="${lx}" y="${ly}" width="${NODE_W2}" height="${NODE_H2}" rx="4" `
             + `fill="white" stroke="${color}" stroke-width="1.5"/>`;
          s += txt(lx + 10, l2y, color, 500, 11, trunc(l2node.label || l2node.id, 11), "start");
        }
      });
    }
  });

  s += `</svg>`;
  return s;
}

// ── Helpers ───────────────────────────────────────────────────
function elbow(x1, y1, x2, y2, mx) {
  const stroke = `stroke="#cfd8dc" stroke-width="1.2" fill="none"`;
  if (Math.abs(y1 - y2) < 1)
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke}/>`;
  return `<path d="M${x1},${y1} H${mx} V${y2} H${x2}" ${stroke}/>`;
}
function txt(x, y, fill, weight, size, content, anchor = "middle") {
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" `
       + `fill="${fill}" font-size="${size}" font-weight="${weight}" `
       + `font-family="-apple-system,BlinkMacSystemFont,sans-serif">${esc(content)}</text>`;
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n) + "…" : s; }
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Re-render on window resize (scale recalculates)
window.addEventListener("resize", () => { if (data.nodes.length) render(); });

init();
</script>
</body>
</html>
