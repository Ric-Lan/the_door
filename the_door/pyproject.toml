[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-door"
version = "1.0.6"
description = "LLM constraint pipeline for translating code structure into functional-language diagrams"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "tree-sitter-language-pack",
    "networkx",
    "jsonschema",
    "mcp",
    "click",
    "pathspec",
    "httpx",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis>=6.0",
    "pytest-cov==5.0.0",
]

[project.scripts]
the-door = "the_door.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests for individual modules",
    "property: Property-based tests using Hypothesis",
    "integration: Integration tests for end-to-end pipelines",
]
